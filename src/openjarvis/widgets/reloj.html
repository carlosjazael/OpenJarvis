<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kasandra</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; user-select: none; cursor: default; font-family: "Segoe UI Variable Display","Segoe UI","Inter",Arial,sans-serif; }
  canvas { display: block; flex: none; }
  #panel { width: 92%; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: -6px; }
  #sub { min-height: 34px; max-width: 100%; text-align: center; font-size: 12.5px; line-height: 1.35; color: #d8f6ff;
         text-shadow: 0 0 8px rgba(40,220,255,.8), 0 0 2px #000, 0 0 6px #000; opacity: 0; transition: opacity .6s;
         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #sub.on { opacity: 1; }
  #sub .you { color: #ff9fd2; text-shadow: 0 0 8px rgba(255,70,170,.8), 0 0 6px #000; }
  #ask { width: 100%; position: relative; }
  #q { width: 100%; box-sizing: border-box; padding: 9px 40px 9px 16px; border-radius: 999px; outline: none;
       background: rgba(4,8,26,.78); color: #e6faff; font: inherit; font-size: 13px; letter-spacing: .3px;
       border: 1px solid rgba(40,220,255,.45); box-shadow: 0 0 14px rgba(40,220,255,.25), inset 0 0 12px rgba(150,95,255,.15);
       opacity: .6; transition: opacity .3s, box-shadow .3s, border-color .3s; }
  #q::placeholder { color: rgba(170,210,240,.55); }
  #q:hover, #q:focus { opacity: 1; border-color: rgba(40,220,255,.9); box-shadow: 0 0 22px rgba(40,220,255,.45), inset 0 0 14px rgba(150,95,255,.25); }
  #ask button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%;
       border: 0; cursor: pointer; background: radial-gradient(circle, rgba(40,220,255,.9), rgba(150,95,255,.7)); color: #04081a; font-size: 14px; }
</style>
</head>
<body>
<canvas id="hud"></canvas>
<div id="panel">
  <div id="sub"></div>
  <form id="ask" autocomplete="off">
    <input id="q" maxlength="2000" placeholder="Escríbele a Kasandra…">
    <button type="submit" title="Enviar">➤</button>
  </form>
</div>
<script>
"use strict";
// ─────────────────────────────────────────────────────────────────────────
// KASANDRA · núcleo holográfico
// Una esfera de partículas viva que florece con la voz, anillos orbitales en
// 3D (uno es el segundero), corona de luz, onda expansiva al empezar a hablar
// y la hora en cristal holográfico.
// Python llama kasiFeed([36 niveles 0-100]) ~30 veces/s y kasiEnd() al final.
// Con ?demo=1 se simula una voz.
// ─────────────────────────────────────────────────────────────────────────
const N_BANDS = 36;
const cv = document.getElementById("hud");
const ctx = cv.getContext("2d");
let S = 0, C = 0, U = 1, DPR = 1;
const PANEL = 96;                 // espacio bajo el núcleo para subtítulos y la caja de texto

function resize() {
  DPR = window.devicePixelRatio || 1;
  S = Math.min(window.innerWidth, window.innerHeight - PANEL);
  C = S / 2; U = S / 480;
  cv.width = S * DPR; cv.height = S * DPR;
  cv.style.width = S + "px"; cv.style.height = S + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeSprites();
}

const TAU = Math.PI * 2;
const CYAN = [40, 220, 255], VIOLET = [150, 95, 255], PINK = [255, 70, 170], GOLD = [255, 200, 120], ICE = [210, 248, 255];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const heat = (l) => l < 0.45 ? mix(CYAN, VIOLET, l / 0.45) : l < 0.8 ? mix(VIOLET, PINK, (l - 0.45) / 0.35) : mix(PINK, GOLD, (l - 0.8) / 0.2);
const FONT = '"Segoe UI Variable Display","Segoe UI","Inter","Helvetica Neue",Arial,sans-serif';
const DIAS = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];
const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

// sprites de brillo pre-renderizados (mucho más rápidos que shadowBlur)
const sprites = {};
function makeSprites() {
  for (const [name, col] of [["cyan", CYAN], ["violet", VIOLET], ["pink", PINK], ["gold", GOLD], ["ice", ICE]]) {
    const s = document.createElement("canvas"), r = 16;
    s.width = s.height = r * 2;
    const g = s.getContext("2d"), gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, rgba(ICE, 1)); gr.addColorStop(0.18, rgba(col, 0.95));
    gr.addColorStop(0.45, rgba(col, 0.28)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    sprites[name] = s;
  }
}
const spriteFor = (l) => l < 0.3 ? sprites.cyan : l < 0.6 ? sprites.violet : l < 0.85 ? sprites.pink : sprites.gold;

// ── audio ──
const target = new Float32Array(N_BANDS), level = new Float32Array(N_BANDS);
let speaking = false, lastPacket = 0, energy = 0, speakMix = 0, bass = 0;
let thinking = false, thinkMix = 0;
const shock = [];
window.kasiFeed = (b) => {
  if (!speaking) shock.push({ r: 110, a: 1 });
  for (let i = 0; i < N_BANDS; i++) target[i] = Math.max(0, Math.min(1, (b[i] || 0) / 100));
  speaking = true; lastPacket = performance.now();
};
window.kasiEnd = () => { speaking = false; target.fill(0); };

// ── texto: escribirle a Kasandra ──
const subEl = document.getElementById("sub"), qEl = document.getElementById("q");
let subTimer = 0;
function showSub(html, ms) {
  subEl.innerHTML = html; subEl.classList.add("on");
  clearTimeout(subTimer); subTimer = setTimeout(() => subEl.classList.remove("on"), ms);
}
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("ask").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = qEl.value.trim();
  if (!text) return;
  qEl.value = "";
  showSub(`<span class="you">Tú:</span> ${esc(text)}`, 60000);
  window.kasiThinking(true);
  console.log("KASI_SEND:" + JSON.stringify(text));   // lo recibe la ventana de Python
});
window.kasiThinking = (on) => { thinking = !!on; };
// Las respuestas solo se escuchan; el texto aparece únicamente con ?subs=1
// (variable de entorno OPENJARVIS_RELOJ_SUBTITULOS=1).
const SHOW_REPLY = new URLSearchParams(location.search).get("subs") === "1";
window.kasiReply = (text) => {
  thinking = false;
  if (!SHOW_REPLY) { clearTimeout(subTimer); subEl.classList.remove("on"); return; }
  const t = String(text || "");
  showSub(esc(t.length > 260 ? t.slice(0, 257) + "…" : t), Math.min(30000, 6000 + t.length * 60));
};
window.kasiStatus = (text) => showSub(`<span class="you">${esc(String(text))}</span>`, 8000);
window.addEventListener("keydown", (ev) => {
  if (document.activeElement !== qEl && ev.key.length === 1 && !ev.ctrlKey && !ev.altKey) qEl.focus();
});

// ── esfera de partículas (Fibonacci) ──
const N = 1400, pts = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  const lat = Math.abs(y);                         // 0 ecuador → 1 polos
  pts.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r, band: Math.min(N_BANDS - 1, Math.floor(lat * N_BANDS)), seed: Math.random() * TAU });
}

// ── anillos orbitales 3D ──
const rings = [
  { r: 168, tiltX: 1.22, tiltZ: 0.35, speed: 0.22, ticks: 60, col: CYAN, clock: true },
  { r: 196, tiltX: 0.32, tiltZ: -0.42, speed: -0.13, ticks: 0, col: VIOLET, dash: true },
  { r: 182, tiltX: 0.42, tiltZ: 0.75, speed: 0.35, ticks: 0, col: PINK, arcs: true },
];
function rot(p, ax, az, ay) {
  let { x, y, z } = p;
  let c = Math.cos(ax), s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(az); s = Math.sin(az); [x, y] = [x * c - y * s, x * s + y * c];
  c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  return { x, y, z };
}
const FOV = 620;
const proj = (p) => { const k = FOV / (FOV + p.z * U); return { x: C + p.x * U * k, y: C + p.y * U * k, k, z: p.z }; };

function drawRing(rg, t, secs) {
  const spin = t * rg.speed * (1 + energy * 2.5 + thinkMix * 4);
  const seg = 180, back = [], front = [];
  for (let i = 0; i <= seg; i++) {
    const a = i / seg * TAU;
    const p = proj(rot({ x: Math.cos(a) * rg.r, y: 0, z: Math.sin(a) * rg.r }, rg.tiltX, rg.tiltZ, spin * 0.25));
    (p.z > 0 ? back : front).push(p);
    p.i = i;
  }
  // línea del anillo con profundidad
  for (let i = 0; i < seg; i++) {
    const a = i / seg * TAU, a2 = (i + 1) / seg * TAU;
    if (rg.dash && i % 3 === 0) continue;
    if (rg.arcs && ((i + Math.floor(t * 20)) % 45) > 26) continue;
    const p1 = proj(rot({ x: Math.cos(a) * rg.r, y: 0, z: Math.sin(a) * rg.r }, rg.tiltX, rg.tiltZ, spin * 0.25));
    const p2 = proj(rot({ x: Math.cos(a2) * rg.r, y: 0, z: Math.sin(a2) * rg.r }, rg.tiltX, rg.tiltZ, spin * 0.25));
    const depth = (1 - (p1.z / rg.r)) / 2;             // 0 atrás → 1 adelante
    ctx.strokeStyle = rgba(rg.col, 0.08 + depth * (0.55 + speakMix * 0.3));
    ctx.lineWidth = (0.6 + depth * 1.6) * U;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  if (rg.ticks) {
    const cur = Math.floor(secs);
    for (let i = 0; i < rg.ticks; i++) {
      const a = -Math.PI / 2 + i / rg.ticks * TAU;
      const inner = proj(rot({ x: Math.cos(a) * (rg.r - (i % 5 ? 4 : 9)), y: 0, z: Math.sin(a) * (rg.r - (i % 5 ? 4 : 9)) }, rg.tiltX, rg.tiltZ, spin * 0.25));
      const outer = proj(rot({ x: Math.cos(a) * rg.r, y: 0, z: Math.sin(a) * rg.r }, rg.tiltX, rg.tiltZ, spin * 0.25));
      const depth = (1 - (outer.z / rg.r)) / 2;
      const lit = i <= cur;
      ctx.strokeStyle = rgba(lit ? ICE : rg.col, (lit ? 0.35 : 0.12) + depth * 0.5);
      ctx.lineWidth = (i % 5 ? 0.8 : 1.6) * U;
      ctx.beginPath(); ctx.moveTo(inner.x, inner.y); ctx.lineTo(outer.x, outer.y); ctx.stroke();
    }
    // cometa del segundero con estela
    for (let k = 0; k < 26; k++) {
      const a = -Math.PI / 2 + (secs - k * 0.06) / 60 * TAU;
      const p = proj(rot({ x: Math.cos(a) * rg.r, y: 0, z: Math.sin(a) * rg.r }, rg.tiltX, rg.tiltZ, spin * 0.25));
      const sz = (k ? 12 - k * 0.4 : 30) * U * p.k;
      ctx.globalAlpha = (1 - k / 26) * (k ? 0.6 : 1);
      ctx.drawImage(k ? sprites.cyan : sprites.ice, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }
}

// ── texto holográfico con aberración cromática ──
function holoText(text, x, y, size, weight, alpha, spacing = 0) {
  ctx.font = `${weight} ${size * U}px ${FONT}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${spacing * U}px`;
  const flick = Math.random() < 0.012 ? 0.4 : 1;
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = `rgba(255,40,120,${0.45 * alpha * flick})`; ctx.fillText(text, x - 1.3 * U, y);
  ctx.fillStyle = `rgba(0,200,255,${0.55 * alpha * flick})`; ctx.fillText(text, x + 1.3 * U, y);
  ctx.shadowColor = rgba(CYAN, 0.9); ctx.shadowBlur = 16 * U;
  ctx.fillStyle = `rgba(225,250,255,${alpha * flick})`; ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}

function curvedText(text, radius, center, size, col, alpha) {
  // arriba se lee en sentido horario; abajo, al revés, para que no quede de cabeza
  ctx.font = `600 ${size * U}px ${FONT}`;
  const bottom = Math.sin(center) > 0;
  const step = ((size * 0.95) / radius) * (bottom ? -1 : 1);
  let a = center - (text.length - 1) * step / 2;
  for (const ch of text) {
    ctx.save(); ctx.translate(C + Math.cos(a) * radius * U, C + Math.sin(a) * radius * U);
    ctx.rotate(a + (bottom ? -Math.PI / 2 : Math.PI / 2));
    ctx.fillStyle = rgba(col, alpha); ctx.fillText(ch, 0, 0); ctx.restore();
    a += step;
  }
}

// ── cuadro ──
const proj3 = [];
function frame(nowMs) {
  const t = nowMs / 1000;
  if (speaking && nowMs - lastPacket > 500) window.kasiEnd();
  let sum = 0;
  for (let i = 0; i < N_BANDS; i++) {
    const tg = target[i];
    level[i] = tg > level[i] ? level[i] + (tg - level[i]) * 0.55 : level[i] * 0.88 + tg * 0.12;
    sum += level[i];
  }
  energy += (sum / N_BANDS - energy) * 0.3;
  bass += ((level[0] + level[1] + level[2] + level[3]) / 4 - bass) * 0.35;
  speakMix += ((speaking ? 1 : 0) - speakMix) * 0.07;
  thinkMix += ((thinking ? 1 : 0) - thinkMix) * 0.06;
  const boost = 0.3 + 0.7 * speakMix;
  const now = new Date(), secs = now.getSeconds() + now.getMilliseconds() / 1000;

  ctx.clearRect(0, 0, S, S);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  // aura
  ctx.globalCompositeOperation = "source-over";
  const aura = ctx.createRadialGradient(C, C, 40 * U, C, C, 235 * U);
  aura.addColorStop(0, rgba(VIOLET, 0.20 + energy * 0.35));
  aura.addColorStop(0.5, rgba(CYAN, 0.07 + energy * 0.18 * speakMix));
  aura.addColorStop(1, rgba(CYAN, 0));
  ctx.fillStyle = aura; ctx.beginPath(); ctx.arc(C, C, 235 * U, 0, TAU); ctx.fill();

  ctx.globalCompositeOperation = "lighter";

  // texto curvo exterior
  curvedText("K A S A N D R A   ·   N Ú C L E O   P E R S O N A L", 226, -Math.PI / 2, 8.5, CYAN, 0.55 + 0.3 * speakMix);
  const status = speaking ? "▲  T R A N S M I T I E N D O  ▲" : thinking ? "◈  P R O C E S A N D O  ◈" : "◇  E N   E S P E R A  ◇";
  curvedText(status, 226, Math.PI / 2, 8, speaking ? PINK : thinking ? GOLD : VIOLET, 0.6 + 0.3 * thinkMix);

  // anillos traseros + delanteros (se dibujan completos con profundidad)
  for (const rg of rings) drawRing(rg, t, secs);

  // corona de rayos cuando habla
  if (speakMix > 0.05) {
    for (let i = 0; i < 72; i++) {
      const a = i / 72 * TAU + t * 0.1;
      let aa = ((a - Math.PI / 2) % TAU + TAU) % TAU; if (aa > Math.PI) aa = TAU - aa;
      const l = level[Math.min(N_BANDS - 1, Math.floor(aa / Math.PI * N_BANDS))];
      if (l < 0.25) continue;
      const r0 = 118 * U, r1 = (124 + l * 95 * boost) * U;
      const g = ctx.createLinearGradient(C + Math.cos(a) * r0, C + Math.sin(a) * r0, C + Math.cos(a) * r1, C + Math.sin(a) * r1);
      g.addColorStop(0, rgba(heat(l), 0.0)); g.addColorStop(0.3, rgba(heat(l), 0.5 * speakMix * l)); g.addColorStop(1, rgba(heat(l), 0));
      ctx.strokeStyle = g; ctx.lineWidth = 2 * U;
      ctx.beginPath(); ctx.moveTo(C + Math.cos(a) * r0, C + Math.sin(a) * r0); ctx.lineTo(C + Math.cos(a) * r1, C + Math.sin(a) * r1); ctx.stroke();
    }
  }

  // esfera viva
  const ry = t * (0.18 + energy * 0.9), rx = 0.38 + Math.sin(t * 0.2) * 0.1;
  proj3.length = 0;
  for (const p of pts) {
    const l = level[p.band];
    const wob = Math.sin(t * 1.6 + p.seed) * 0.5 + 0.5;
    const R = 96 + (2.5 + 3 * wob) * (1 - speakMix) + thinkMix * 6 * Math.sin(p.y * 9 - t * 6) + l * 62 * boost + bass * 10 * Math.sin(p.seed * 3 + t * 8) * speakMix;
    const q = rot({ x: p.x * R, y: p.y * R, z: p.z * R }, rx, 0, ry);
    const pr = proj(q); pr.l = l; pr.R = R;
    proj3.push(pr);
  }
  proj3.sort((a, b) => b.z - a.z);           // de atrás hacia adelante
  for (const p of proj3) {
    const depth = (1 - p.z / p.R) / 2;        // 0 atrás → 1 adelante
    const sz = (3 + depth * 6 + p.l * 10 * boost) * U * p.k;
    ctx.globalAlpha = 0.12 + depth * 0.75;
    ctx.drawImage(spriteFor(p.l * boost + 0.05), p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;

  // ondas expansivas
  for (let i = shock.length - 1; i >= 0; i--) {
    const s = shock[i]; s.r += 4.5; s.a -= 0.018;
    if (s.a <= 0) { shock.splice(i, 1); continue; }
    ctx.strokeStyle = rgba(PINK, s.a * 0.7); ctx.lineWidth = 3 * s.a * U;
    ctx.beginPath(); ctx.arc(C, C, s.r * U, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba(CYAN, s.a * 0.5); ctx.lineWidth = 1 * U;
    ctx.beginPath(); ctx.arc(C, C, (s.r - 10) * U, 0, TAU); ctx.stroke();
  }

  // lente de cristal para la hora
  ctx.globalCompositeOperation = "source-over";
  const lens = ctx.createRadialGradient(C, C, 0, C, C, 78 * U);
  lens.addColorStop(0, "rgba(3,6,20,0.78)"); lens.addColorStop(0.7, "rgba(3,6,20,0.55)"); lens.addColorStop(1, "rgba(3,6,20,0)");
  ctx.fillStyle = lens; ctx.beginPath(); ctx.arc(C, C, 78 * U, 0, TAU); ctx.fill();

  // hora
  const hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
  const colon = now.getMilliseconds() < 500 ? ":" : " ";
  holoText(`${hh}${colon}${mm}`, C, C - 4 * U, 58, 200, 1, 1);
  ctx.globalCompositeOperation = "lighter";
  ctx.font = `600 ${9 * U}px ${FONT}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${3 * U}px`;
  ctx.fillStyle = "rgba(160,190,235,0.85)";
  ctx.fillText(`${DIAS[now.getDay()]} ${now.getDate()} ${MESES[now.getMonth()]}`, C, C + 36 * U);
  ctx.fillStyle = rgba(CYAN, 0.75);
  ctx.fillText(String(Math.floor(secs)).padStart(2, "0") + " s", C, C - 44 * U);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";

  // ecualizador mini bajo la fecha
  for (let i = 0; i < 18; i++) {
    const l = Math.max(level[i * 2], 0.04 + 0.03 * Math.sin(t * 3 + i));
    const h = (2 + l * 16 * boost) * U, x = C + (i - 8.5) * 4.2 * U;
    ctx.fillStyle = rgba(heat(l), 0.85);
    ctx.fillRect(x - 1.2 * U, C + 56 * U - h / 2, 2.4 * U, h);
  }

  // líneas de escaneo holográficas
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  const off = (t * 30) % 4;
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, 160 * U, 0, TAU); ctx.clip();
  for (let y = -off; y < S; y += 4 * U) ctx.fillRect(0, y, S, 1 * U);
  ctx.restore();

  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize); resize();

// ── demo ──
if (new URLSearchParams(location.search).has("demo")) {
  let tt = 0;
  setInterval(() => {
    tt += 1 / 30;
    const cyc = tt % 7;
    if (cyc > 5.2 || cyc < 0.8) { if (speaking) window.kasiEnd(); return; }
    const syl = Math.pow(Math.max(0, Math.sin(tt * 10.5)), 0.6) * (0.65 + 0.35 * Math.sin(tt * 2.1));
    const b = [];
    for (let i = 0; i < N_BANDS; i++) {
      const f = Math.exp(-((i - 5) ** 2) / 16) + 0.75 * Math.exp(-((i - 15 - 4 * Math.sin(tt * 3.1)) ** 2) / 10) + 0.45 * Math.exp(-((i - 27) ** 2) / 18);
      b.push(Math.min(100, 105 * syl * f * (0.85 + 0.3 * Math.random())));
    }
    window.kasiFeed(b);
  }, 1000 / 30);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
